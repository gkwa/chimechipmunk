[project]
name = "chimechipmunk"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Taylor Monacelli", email = "taylormonacelli@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "tomlkit>=0.13.2",
]

[project.scripts]
chimechipmunk = "chimechipmunk:main"

[build-system]
requires = ["uv_build>=0.8.8,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
preview = true


[tool.ruff.lint]
select = ["ALL"]
ignore = ["T201", "CPY001"]
[tool.pyright]
venvPath = "."
venv = ".venv"
